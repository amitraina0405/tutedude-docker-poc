<!DOCTYPE html>
<html>
<head>
<title>Todo Form</title>
</head>
<body>
<h1>Add a Todo Item</h1>
<form id="todoForm">
<label>Item Name:</label><br>
<input type="text" name="itemName" id="itemName" required><br><br>
<label>Item Description:</label><br>
<textarea name="itemDescription" id="itemDescription" required></textarea><br><br>
<button type="submit">Submit</button>
</form>
<p id="responseMessage"></p>
<script>
       const form = document.getElementById('todoForm');
       const responseMessage = document.getElementById('responseMessage');
       form.addEventListener('submit', async (e) => {
           e.preventDefault();
           const itemName = document.getElementById('itemName').value;
           const itemDescription = document.getElementById('itemDescription').value;
           try {
               const response = await fetch('http://127.0.0.1:5000/submittodoitem', { // Flask backend URL
                   method: 'POST',
                   headers: { 'Content-Type': 'application/json' },
                   body: JSON.stringify({ itemName, itemDescription })
               });
               const data = await response.json();
               responseMessage.textContent = data.message || 'Data submitted successfully!';
           } catch (error) {
               responseMessage.textContent = 'Error submitting data: ' + error;
           }
       });
</script>
</body>
</html>
